[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optimind"
version = "0.1.0"
description = "AI-enhanced options trading system for Optionetics-style delta-neutral strategies"
requires-python = ">=3.12"
dependencies = [
    # Broker
    "ib_async>=1.0.1",
    # Data / Analytics
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "py_vollib>=1.0.1",
    # DB / ORM
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    # Config / Validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # AI
    "anthropic>=0.40",
    "jinja2>=3.1",
    # MCP
    "mcp>=1.0",
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    # Scheduling
    "apscheduler>=3.10",
    "exchange-calendars>=4.5",
    # Logging
    "structlog>=24.0",
    # HTTP (Tradier Phase 4)
    "httpx>=0.27",
    # Dashboard
    "streamlit>=1.35",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "pandas-stubs",
]

[project.scripts]
optimind = "optimind.cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=optimind --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "optimind/dashboard/*"]
